- title: Human Aspect
  slug: human-aspect
  description: Avoiding social engineering security risks
  icon: human
  intro: >-
    Many data breaches, hacks and attacks are caused by human error.
    The following list contains steps you should take, to reduce the risk of this
    happening to you. Many of them are common sense, but it's worth takin note of.

  checklist:
  - point: Verify Recipients
    priority: Essential
    details: >-
      Emails can be easily spoofed. Verify the sender's authenticity, especially for sensitive actions, and prefer entering URLs manually rather than clicking links in emails.

  - point: Don't Trust Your Popup Notifications
    priority: Essential
    details: >-
      Fake pop-ups can be deployed by malicious actors. Always check the URL before entering any information on a popup.

  - point: Never Leave Device Unattended
    priority: Essential
    details: >-
      Unattended devices can be compromised even with strong passwords. Use encryption and remote erase features like Find My Phone for lost devices.

  - point: Prevent Camfecting
    priority: Essential
    details: >-
      Protect against camfecting by using webcam covers and microphone blockers. Mute home assistants when not in use or discussing sensitive matters.

  - point: Stay protected from shoulder surfers
    priority: Essential
    details: >-
      Use privacy screens on laptops and mobiles to prevent others from reading your screen in public spaces.

  - point: Educate yourself about phishing attacks
    priority: Essential
    details: >-
      Be cautious of phishing attempts. Verify URLs, context of received messages, and employ good security practices like using 2FA and not reusing passwords.

  - point: Install Reputable Software from Trusted Sources
    priority: Essential
    details: >-
      Only download software from legitimate sources and check files with tools
      like Virus Total before installation.

  - point: Store personal data securely
    priority: Essential
    details: >-
      Ensure all personal data on devices or in the cloud is encrypted to protect against unauthorized access.

  - point: Obscure Personal Details from Documents
    priority: Essential
    details: >-
      When sharing documents, obscure personal details with opaque rectangles to prevent information leakage.

  - point: Do not assume a site is secure, just because it is `HTTPS`
    priority: Essential
    details: >-
      HTTPS does not guarantee a website's legitimacy. Verify URLs and exercise caution with personal data.

  - point: Opt-out of public lists
    priority: Optional
    details: >-
      Remove yourself from public databases and marketing lists to reduce unwanted contacts and potential risks.

  - point: Never Provide Additional PII When Opting-Out
    priority: Optional
    details: >-
      Do not provide additional personal information when opting out of data services to avoid further data collection.

  - point: Opt-out of data sharing
    priority: Optional
    details: >-
      Many apps and services default to data sharing settings. Opt out to protect your data from being shared with third parties.

  - point: Remove Yourself from Data Broker Sites
    priority: Optional
    details: >-
      Data brokers compile and sell dossiers — addresses, relatives, phone numbers, employment — assembled from
      public records and purchased datasets. These profiles are what social engineers and stalkers use, and they
      are what makes answering "security questions" honestly so dangerous. Most brokers are legally obliged to
      honour deletion requests, and several jurisdictions (the EU under GDPR, California under CCPA/CPRA, and a
      growing list of US states) give you an enforceable right to demand it. Work through the major brokers one by
      one, or use a removal service if the volume is unmanageable. Expect to repeat this: profiles are commonly
      rebuilt within a year.

  - point: Compartmentalize Your Identities
    priority: Advanced
    details: >-
      Keep different areas of your life on separate identities — separate email addresses, usernames and
      payment methods for banking, shopping, work and social accounts. If one is breached or linked back
      to you, the others aren't. This is the human counterpart to isolating programs and data on your
      computer.

  - point: WhoIs Privacy Guard
    priority: Advanced
    details: >-
      Use WhoIs Privacy Guard for domain registrations to protect your personal information from public searches.

  - point: Use a forwarding address
    priority: Advanced
    details: >-
      Use a PO Box or forwarding address for mail to prevent companies from knowing your real address, adding a layer of privacy protection.

  - point: Use anonymous payment methods
    priority: Advanced
    details: >-
      Opt for anonymous payment methods like cryptocurrencies to avoid entering identifiable information online.

  color: indigo

- title: Physical Security
  slug: physical-security
  description: Taking measures to prevent IRL security incidents
  icon: physical
  intro: >-
    Public records often include sensitive personal data (full name, date of birth,
    phone number, email, address, ethnicity etc), and are gathered from a range of
    sources (census records, birth/ death/ marriage certificates, voter registrants,
    marketing information, customer databases, motor vehicle records, professional/
    business licenses and all court files in full detail). This sensitive personal
    information is
    [easy and legal to access](https://www.consumerreports.org/consumerist/its-creepy-but-not-illegal-for-this-website-to-provide-all-your-public-info-to-anyone/),
    which raises some [serious privacy concerns](https://privacyrights.org/resources/public-records-internet-privacy-dilemma)
    (identity theft, personal safety risks/ stalkers, destruction of reputations, dossier society)


    CCTV is one of the major ways that the corporations, individuals and the government
    tracks your movements. In London, UK the average person is caught on camera about
    500 times per day. This network is continuing to grow, and in many cities around
    the world, facial recognition is being rolled out, meaning the state can know
    the identity of residents on the footage in real-time.

    Strong authentication, encrypted devices, patched software and anonymous web
    browsing may be of little use if someone is able to physically compromise you,
    your devices and your data. This section outlines some basic methods for physical security

  checklist:
  - point: Destroy Sensitive Documents
    priority: Essential
    details: |
      Shred or redact sensitive documents before disposal to protect against
      identity theft and maintain confidentiality.

  - point: Opt-Out of Public Records
    priority: Essential
    details: |
      Contact people search websites to opt-out from listings that show persona
      information, using guides like Michael Bazzell's Personal Data Removal Workbook.

  - point: Watermark Documents
    priority: Essential
    details: |
      Add a watermark with the recipient's name and date to digital copies of
      personal documents to trace the source of a breach.

  - point: Don't Reveal Info on Inbound Calls
    priority: Essential
    details: |
      Only share personal data on calls you initiate and verify the recipient's phone number.

  - point: Stay Alert
    priority: Essential
    details: Be aware of your surroundings and assess potential risks in new environments.

  - point: Secure Perimeter
    priority: Essential
    details: Ensure physical security of locations storing personal info devices, minimizing external access and using intrusion detection systems.

  - point: Physically Secure Devices
    priority: Essential
    details: Use physical security measures like Kensington locks, webcam covers, and privacy screens for devices.

  - point: Keep Devices Out of Direct Sight
    priority: Essential
    details: Prevent devices from being visible from outside to mitigate risks from lasers and theft.

  - point: Protect your PIN
    priority: Essential
    details: Shield your PIN entry from onlookers and cameras, and clean touchscreens after use.

  - point: Check for Skimmers
    priority: Essential
    details: Inspect ATMs and public devices for skimming devices and tampering signs before use.

  - point: Protect your Home Address
    priority: Optional
    details: Use alternative locations, forwarding addresses, and anonymous payment methods to protect your home address.

  - point: Use a PIN, Not Biometrics
    priority: Advanced
    details: Prefer PINs over biometrics for device security in situations where legal coercion to unlock devices may occur.

  - point: Reduce exposure to CCTV
    priority: Advanced
    details: Wear disguises and choose routes with fewer cameras to avoid surveillance.

  - point: Anti-Facial Recognition Clothing
    priority: Advanced
    details: Wear clothing with patterns that trick facial-recognition technology.

  - point: Reduce Night Vision Exposure
    priority: Advanced
    details: Use IR light sources or reflective glasses to obstruct night vision cameras.

  - point: Protect your DNA
    priority: Advanced
    details: Avoid sharing DNA with heritage websites and be cautious about leaving DNA traces.

  - point: Prepare Devices Before Crossing a Border
    priority: Optional
    details: >-
      Border officers in many countries can search electronic devices without a warrant or individual suspicion,
      and in some can compel you to unlock them or deny entry if you refuse. Decide in advance what you are willing
      to carry: travel with a clean device holding only what you need, sign out of accounts you do not need en
      route, and pull the data you do need from the cloud after you arrive. Power devices fully off before the
      crossing — encryption keys are held in memory while a device is merely locked, and biometric unlocks are far
      easier to compel than a passphrase in most legal systems.

  - point: Take Extra Care on Public and Hotel Networks
    priority: Essential
    details: >-
      Treat any network you don't control as hostile. Modern HTTPS protects the contents of most traffic, so the
      old advice about coffee-shop Wi-Fi is overstated, but a hostile network still sees which sites you visit and
      can serve convincing captive-portal pages that ask for credentials. Use your phone's hotspot in preference
      to open Wi-Fi where you can, be sceptical of any login page a network presents to you, and never install a
      certificate or profile a network asks you to add.

  - point: Beware Public Charging Points
    priority: Optional
    details: >-
      A charging port can carry data as well as power. The practical risk is lower than the headlines suggest —
      modern phones ask permission before trusting a connected computer — but the defence costs nothing: carry
      your own charger and plug into a wall socket, or use a USB data blocker or charge-only cable when you must
      use a public port. A battery pack removes the question entirely.

  color: lime

- title: AI & Privacy
  slug: ai-privacy
  description: Protecting your data and privacy in the age of AI assistants
  icon: ai
  color: violet
  intro: >-
    AI assistants, chatbots, and generative tools are now part of everyday life — but everything you type
    into them can be logged, used to train future models, and reviewed by humans. This section covers how to
    use AI tools without handing over your private data, how to spot AI-powered scams, and how to keep
    control of your digital identity as deepfakes and voice cloning become mainstream.
  checklist:
  - point: Never Share Secrets with AI Chatbots
    priority: Essential
    details: >-
      Treat anything you type into a public AI assistant (ChatGPT, Gemini, Copilot, etc.) as potentially
      permanent and readable by others. Do not paste passwords, API keys, financial details, health records,
      or confidential work data. Many providers retain conversations and may use them to train future models,
      and support staff can sometimes review flagged chats.
  - point: Turn Off Model Training on Your Data
    priority: Essential
    details: >-
      Most major AI providers let you opt out of having your conversations used for training — look in the
      privacy or data-controls settings and disable it. Where available, enable "temporary" or "incognito"
      chat modes for anything sensitive, and periodically clear your chat history.
  - point: Be Sceptical of AI-Generated Messages
    priority: Essential
    details: >-
      Phishing emails, texts, and voicemails are now written by AI, making them grammatically perfect and
      highly convincing. Never trust urgency or authority in a message alone — verify unexpected requests
      through a separate, known channel before clicking links or transferring money.
  - point: Verify Voice and Video (Deepfakes)
    priority: Essential
    details: >-
      Voice cloning needs only a few seconds of audio, and video deepfakes are increasingly realistic.
      Agree on a private "safe word" with close family and colleagues to confirm identity during unexpected
      phone or video requests, especially any involving money or credentials.
  - point: Review AI App Permissions
    priority: Optional
    details: >-
      AI features baked into your phone, browser, and office apps often request broad access to your emails,
      files, screen, and microphone. Grant only what each tool genuinely needs, and disable AI features that
      continuously read your screen or record activity if you don't use them.
  - point: Prefer Local or Private AI Models
    priority: Optional
    details: >-
      For sensitive tasks, use AI that runs entirely on your own device (such as local models via Ollama or
      LM Studio) so your prompts never leave your machine. If you must use a cloud service, prefer providers
      with a clear zero-retention or enterprise privacy policy.
  - point: Limit Your Public Voice and Photo Footprint
    priority: Advanced
    details: >-
      The less audio and video of you exists publicly, the harder you are to clone. Consider making old
      videos and voice notes private, and be mindful of what you post publicly on social media that could be
      scraped to build a synthetic version of you.
  - point: Watch for Data Scraping and Opt Out
    priority: Advanced
    details: >-
      Your public posts, images, and writing may be scraped to train AI models. Where regulations allow
      (e.g. GDPR), submit opt-out or data-removal requests, and use platforms that block AI crawlers or let
      you tag content as "do not train".
  - point: Don't Blindly Trust AI Output
    priority: Advanced
    details: >-
      AI tools confidently produce wrong answers ("hallucinations") and can be manipulated by attackers.
      Independently verify security, legal, medical, or financial advice from an AI before acting on it, and
      never run code or commands suggested by an AI without understanding what they do.
