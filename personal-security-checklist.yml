- title: Backup & Recovery
  slug: backup-recovery
  description: Getting your data and your accounts back when something goes wrong
  icon: backup
  color: orange
  intro: >-
    Every other section in this checklist tries to stop bad things happening. This one assumes something
    eventually will - a failed drive, a stolen laptop, ransomware, or simply losing the phone that holds your
    second factor. The difference between an inconvenience and a catastrophe is almost always whether a
    working backup and a usable recovery path existed beforehand. Both have to be set up while everything is
    still fine.
  checklist:
  - point: Follow the 3-2-1 Rule
    priority: Essential
    details: >-
      Keep **three** copies of anything you care about, on **two** different kinds of media, with **one** of
      them off-site. The reasoning is that backup failures are usually correlated: the same flood, theft,
      power surge, ransomware or mistaken deletion that takes the original often takes a backup sitting next
      to it. An external drive at home plus an encrypted cloud copy satisfies this for most people, and is far
      more robust than either on its own.

  - point: Keep One Backup Offline
    priority: Essential
    details: >-
      Ransomware deliberately looks for backups, and anything permanently mounted or continuously synced is
      reachable by whatever is running on your machine. Keep at least one copy physically disconnected between
      backups, or use a service offering immutable or versioned storage that the client cannot retroactively
      delete. Sync services like Dropbox or iCloud are not backups on their own - they faithfully replicate
      deletions and encryption to every device.

  - point: Encrypt Your Backups
    priority: Essential
    details: >-
      A backup is a complete copy of your data with none of your device's protections around it. Encrypt it
      before it leaves your control: most backup software offers this directly, and
      [Cryptomator](https://cryptomator.org) or [VeraCrypt](https://veracrypt.fr) can encrypt what a provider
      does not. Store the backup passphrase somewhere separate from the backup itself - losing it makes the
      backup as useless as not having one.

  - point: Test That You Can Actually Restore
    priority: Essential
    details: >-
      This is the step nearly everyone skips, and the reason most backup strategies fail at exactly the wrong
      moment. A backup job reporting success proves only that files were written - not that they can be read
      back, not that the encryption passphrase still works, and not that the set is complete. Once or twice a
      year, restore a handful of files to a different machine and open them. Far better to find the problem
      now.

  - point: Automate It
    priority: Essential
    details: >-
      A backup that depends on remembering to run it will be weeks out of date when you need it. Schedule it,
      and check the job's own reporting occasionally, so that a silent failure doesn't go unnoticed for
      months.

  - point: Harden Your Account Recovery Options
    priority: Essential
    details: >-
      Recovery is the back door to every account, and it is routinely weaker than the front. A password
      manager and a hardware key protect nothing if the account will also let anyone holding your phone
      number, or knowing your mother's maiden name, reset it. Audit the recovery methods on your important
      accounts: remove SMS where a better option exists, make sure the recovery email is itself an account
      secured to the same standard, and treat security questions as extra passwords - store random answers in
      your password manager rather than facts a data broker sells.

  - point: Store Recovery Codes Where You Can Reach Them
    priority: Essential
    details: >-
      Backup codes solve exactly one problem: losing your second factor. That makes storing them only inside
      the account they unlock, or only on the phone that is the second factor, self-defeating. Print them and
      keep them somewhere physically secure, or store them in a password manager you can reach from another
      device. Whichever you choose, confirm you could get to them from a borrowed computer with nothing of
      your own to hand - because that is the situation you will be in.

  - point: Keep an Offline Record of Critical Accounts
    priority: Optional
    details: >-
      If your password manager, phone and laptop were all unavailable at once, could you list the accounts
      that matter and how to reach their support? A short written record - which email address each critical
      account uses, which are tied to which phone number, which have backup codes and where they are - kept in
      a safe or with someone you trust turns a total lockout into a slow afternoon. It does not need to
      contain any passwords to be useful.

  - point: Plan for Emergency and Long-Term Access
    priority: Optional
    details: >-
      Security done well means nobody can get into your accounts, including the people who may need to if you
      are seriously ill or die. Most password managers offer an emergency-access feature that grants a chosen
      contact entry after a waiting period you can cancel, and Apple, Google and Microsoft all provide legacy
      or inactive-account mechanisms. Set one up, and tell the person concerned that it exists. Deciding this
      deliberately is far better than either leaving your family locked out or leaving your master password in
      a drawer.

  - point: Know What to Do If You Are Breached
    priority: Essential
    details: >-
      Decide the order of operations before you need it, because the first hour matters and panic is a poor
      guide. Broadly: get onto a device you trust; change the password on your email account first, since it
      controls the resets for everything else; then revoke active sessions and application tokens rather than
      only changing passwords, because a stolen session cookie survives a password change. Work outwards to
      financial and social accounts, check for recovery addresses or mail-forwarding rules the attacker may
      have added, and contact your bank directly if money is involved. Only then worry about how it happened.

